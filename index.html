<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Health Dashboard</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #1b2528;
      --muted: #647174;
      --line: #d9ded8;
      --soft: #eef2ed;
      --accent: #1c6b5a;
      --accent-dark: #10463f;
      --blue: #1f5f99;
      --gold: #c58a16;
      --red: #b94335;
      --green-soft: #dceee8;
      --blue-soft: #dbe9f5;
      --gold-soft: #f7ebcd;
      --shadow: 0 10px 24px rgba(27, 37, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    button, input, select { font: inherit; }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .header-inner, main {
      width: min(1680px, calc(100% - 28px));
      margin: 0 auto;
    }

    .header-inner {
      min-height: 76px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    main { padding: 18px 0 34px; }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 0.8fr) minmax(240px, 1.2fr) minmax(220px, 1fr) minmax(150px, 0.7fr);
      gap: 10px;
      margin-bottom: 14px;
      align-items: end;
    }

    label {
      display: block;
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .input, .select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      padding: 0 10px;
      min-width: 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      min-height: 102px;
      box-shadow: var(--shadow);
      display: grid;
      align-content: space-between;
      gap: 8px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .metric .value {
      font-size: 25px;
      font-weight: 850;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .metric .note {
      color: var(--muted);
      font-size: 12px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-head {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .chart-wrap { padding: 12px 12px 14px; }

    .chart {
      height: 280px;
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 8px;
      align-items: stretch;
    }

    .axis-y {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      padding: 5px 0 24px;
    }

    .bars {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(38px, 1fr);
      gap: 8px;
      align-items: end;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .bar-col {
      min-width: 38px;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 6px;
    }

    .bar-stack {
      display: grid;
      align-items: end;
      height: 100%;
      border-bottom: 1px solid var(--line);
    }

    .bar {
      width: 100%;
      min-height: 2px;
      border-radius: 5px 5px 0 0;
      background: var(--accent);
    }

    .bar.blue { background: var(--blue); }
    .bar.gold { background: var(--gold); }

    .bar-label {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }

    .split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .category-list {
      padding: 12px 14px 15px;
      display: grid;
      gap: 11px;
    }

    .category-row {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) minmax(120px, 1.4fr) 74px;
      gap: 10px;
      align-items: center;
    }

    .track {
      height: 10px;
      background: var(--soft);
      border-radius: 99px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: inherit;
    }

    .fill.blue { background: var(--blue); }
    .fill.gold { background: var(--gold); }
    .fill.red { background: var(--red); }

    .row-value {
      text-align: right;
      font-weight: 800;
    }

    .table-panel { margin-top: 14px; overflow: hidden; }
    .table-wrap { overflow: auto; max-height: 560px; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1120px;
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f9faf8;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    tbody tr:hover { background: #fbfcfa; }

    .shop-list {
      padding: 0;
      max-height: 520px;
      overflow: auto;
    }

    .shop-row {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 90px 90px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
    }

    .shop-row:hover, .shop-row.active { background: #f3f7f4; }

    .shop-name {
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      justify-self: end;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--soft);
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-dark);
    }

    .empty {
      color: var(--muted);
      padding: 18px;
      text-align: center;
    }

    @media (max-width: 1120px) {
      .summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .layout, .split { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .header-inner { grid-template-columns: 1fr; gap: 6px; padding: 12px 0; }
      .status { text-align: left; }
      .controls, .summary-grid { grid-template-columns: 1fr; }
      .chart { grid-template-columns: 38px 1fr; }
      .category-row { grid-template-columns: 1fr; gap: 5px; }
      .row-value { text-align: left; }
      .shop-row { grid-template-columns: minmax(0, 1fr) 72px 72px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Shop Health Dashboard</h1>
        <p class="subtitle">Monthly totals by shop, rebuilt from shop_health_primary_list.</p>
      </div>
      <div id="status" class="status">Loading monthly totals...</div>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Dashboard filters">
      <div>
        <label for="monthSelect">Month</label>
        <select id="monthSelect" class="select"></select>
      </div>
      <div>
        <label for="shopSelect">Shop</label>
        <select id="shopSelect" class="select"></select>
      </div>
      <div>
        <label for="searchInput">Search</label>
        <input id="searchInput" class="input" type="search" placeholder="Shop name">
      </div>
      <div>
        <label for="sortSelect">Rank Shops By</label>
        <select id="sortSelect" class="select">
          <option value="calls">Total calls</option>
          <option value="visits">BDC visits</option>
          <option value="revenue">BDC effective RO</option>
          <option value="appointments">Appointments</option>
          <option value="sentiment">Sentiment</option>
          <option value="shop">Shop A-Z</option>
        </select>
      </div>
    </section>

    <section id="summaryGrid" class="summary-grid" aria-label="Monthly KPI summary"></section>

    <section class="layout">
      <div>
        <section class="panel">
          <div class="panel-head">
            <h2 id="trendTitle">Monthly Trend</h2>
            <select id="metricSelect" class="select" style="max-width: 220px">
              <option value="calls">Total Calls</option>
              <option value="visits">BDC Visits</option>
              <option value="revenue">BDC Effective RO</option>
              <option value="appointments">Appointments</option>
              <option value="sentiment">Sentiment Score</option>
            </select>
          </div>
          <div class="chart-wrap">
            <div id="trendChart" class="chart"></div>
          </div>
        </section>

        <section class="split">
          <section class="panel">
            <div class="panel-head">
              <h2>Call Programs</h2>
              <div id="programTotal" class="status"></div>
            </div>
            <div id="programList" class="category-list"></div>
          </section>
          <section class="panel">
            <div class="panel-head">
              <h2>Next Day Calls</h2>
              <div id="nextDayTotal" class="status"></div>
            </div>
            <div id="nextDayList" class="category-list"></div>
          </section>
        </section>
      </div>

      <aside class="panel">
        <div class="panel-head">
          <h2>Shop Ranking</h2>
          <div id="rankingStatus" class="status"></div>
        </div>
        <div id="shopRanking" class="shop-list"></div>
      </aside>
    </section>

    <section class="panel table-panel">
      <div class="panel-head">
        <h2>Monthly Detail</h2>
        <div id="tableStatus" class="status"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Month</th>
              <th>Shop</th>
              <th>Total Calls</th>
              <th>BDC Visits</th>
              <th>BDC Effective RO</th>
              <th>BDC Avg RO</th>
              <th>Starter Calls</th>
              <th>Pro Calls</th>
              <th>Appointments</th>
              <th>Sentiment</th>
            </tr>
          </thead>
          <tbody id="detailRows"></tbody>
        </table>
      </div>
    </section>
  </main>

eturning_Lost_Vehicle":43},{"Shop_Name":"Redwood General Tire","Month":"2026-05","Next_Day_Satisfaction":3,"Welcome_New_Customer":8,"Welcome_New_Vehicle":null,"Returning_Lost_Vehicle":5},{"Shop_Name":"RMS Auto Care","Month":"2026-05","Next_Day_Satisfaction":310,"Welcome_New_Customer":152,"Welcome_New_Vehicle":35,"Returning_Lost_Vehicle":49},{"Shop_Name":"Roggi\u0027s Hartford CT","Month":"2026-05","Next_Day_Satisfaction":81,"Welcome_New_Customer":56,"Welcome_New_Vehicle":17,"Returning_Lost_Vehicle":19},{"Shop_Name":"Tire City \u0026 Auto - Atlanta Hwy, Montgomery AL","Month":"2026-05","Next_Day_Satisfaction":131,"Welcome_New_Customer":118,"Welcome_New_Vehicle":23,"Returning_Lost_Vehicle":17}]};

    const fields = {
      calls: "Total Calls",
      visits: "Total BDC Visits",
      revenue: "Total BDC Effective RO",
      avgRo: "BDC Avg RO",
      starter: "Starter Calls",
      pro: "Pro Calls",
      appointments: "Appointments",
      sentiment: "sentiment_score"
    };

    const state = {
      month: "latest",
      shop: "all",
      search: "",
      sort: "calls",
      metric: "calls"
    };

    const els = {
      status: document.getElementById("status"),
      monthSelect: document.getElementById("monthSelect"),
      shopSelect: document.getElementById("shopSelect"),
      searchInput: document.getElementById("searchInput"),
      sortSelect: document.getElementById("sortSelect"),
      metricSelect: document.getElementById("metricSelect"),
      summaryGrid: document.getElementById("summaryGrid"),
      trendTitle: document.getElementById("trendTitle"),
      trendChart: document.getElementById("trendChart"),
      programTotal: document.getElementById("programTotal"),
      programList: document.getElementById("programList"),
      nextDayTotal: document.getElementById("nextDayTotal"),
      nextDayList: document.getElementById("nextDayList"),
      shopRanking: document.getElementById("shopRanking"),
      rankingStatus: document.getElementById("rankingStatus"),
      detailRows: document.getElementById("detailRows"),
      tableStatus: document.getElementById("tableStatus")
    };

    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
    const number = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
    const decimal = new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 });

    function cleanNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function monthLabel(month) {
      const [year, monthNumber] = month.split("-").map(Number);
      return new Date(year, monthNumber - 1, 1).toLocaleDateString("en-US", { month: "short", year: "numeric" });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function formatMetric(key, value) {
      if (key === "revenue" || key === "avgRo") return money.format(value || 0);
      if (key === "sentiment") return value ? `${Math.round(value * 100)}%` : "N/A";
      return number.format(value || 0);
    }

    function hydrateData() {
      const sentimentMap = new Map();
      for (const row of RAW_DATA.sentiment) {
        sentimentMap.set(`${row.Shop_Name}|${row.Date}`, cleanNumber(row.Shop_Score));
      }

      return RAW_DATA.pastMonths.map(row => {
        const sentiment = sentimentMap.get(`${row.Shop_Name}|${row.Date}`);
        return {
          shop: row.Shop_Name || "Unknown Shop",
          month: row.Date,
          calls: cleanNumber(row[fields.calls]),
          visits: cleanNumber(row[fields.visits]),
          revenue: cleanNumber(row[fields.revenue]),
          avgRo: cleanNumber(row[fields.avgRo]),
          starter: cleanNumber(row[fields.starter]),
          pro: cleanNumber(row[fields.pro]),
          nextDay: cleanNumber(row.Next_Day_Satisfaction),
          welcomeCustomer: cleanNumber(row.Welcome_New_Customer),
          welcomeVehicle: cleanNumber(row.Welcome_New_Vehicle),
          returningLost: cleanNumber(row.Returning_Lost_Vehicle),
          appointments: cleanNumber(row.Appointments),
          sentiment: sentiment ?? cleanNumber(row.sentiment_score)
        };
      }).filter(row => row.month);
    }

    const rows = hydrateData();
    const months = [...new Set(rows.map(row => row.month))].sort();
    const shops = [...new Set(rows.map(row => row.shop))].sort((a, b) => a.localeCompare(b));
    const latestMonth = months[months.length - 1];

    function selectedMonth() {
      return state.month === "latest" ? latestMonth : state.month;
    }

    function activeRows() {
      const month = selectedMonth();
      const search = state.search.trim().toLowerCase();
      return rows.filter(row => {
        if (row.month !== month) return false;
        if (state.shop !== "all" && row.shop !== state.shop) return false;
        if (search && !row.shop.toLowerCase().includes(search)) return false;
        return true;
      });
    }

    function trendRows() {
      return months.map(month => summarize(rows.filter(row => {
        if (row.month !== month) return false;
        if (state.shop !== "all" && row.shop !== state.shop) return false;
        return true;
      }), month));
    }

    function summarize(sourceRows, month = selectedMonth()) {
      const totals = {
        month,
        shops: new Set(sourceRows.map(row => row.shop)).size,
        calls: 0,
        visits: 0,
        revenue: 0,
        starter: 0,
        pro: 0,
        nextDay: 0,
        welcomeCustomer: 0,
        welcomeVehicle: 0,
        returningLost: 0,
        appointments: 0,
        sentimentTotal: 0,
        sentimentRows: 0
      };

      for (const row of sourceRows) {
        totals.calls += row.calls;
        totals.visits += row.visits;
        totals.revenue += row.revenue;
        totals.starter += row.starter;
        totals.pro += row.pro;
        totals.nextDay += row.nextDay;
        totals.welcomeCustomer += row.welcomeCustomer;
        totals.welcomeVehicle += row.welcomeVehicle;
        totals.returningLost += row.returningLost;
        totals.appointments += row.appointments;
        if (row.sentiment) {
          totals.sentimentTotal += row.sentiment;
          totals.sentimentRows += 1;
        }
      }

      totals.avgRo = totals.visits ? totals.revenue / totals.visits : 0;
      totals.sentiment = totals.sentimentRows ? totals.sentimentTotal / totals.sentimentRows : 0;
      return totals;
    }

    function shopSummaries() {
      const month = selectedMonth();
      const search = state.search.trim().toLowerCase();
      return shops.map(shop => summarize(rows.filter(row => row.shop === shop && row.month === month), month))
        .map((summary, index) => ({ ...summary, shop: shops[index] }))
        .filter(summary => summary.shop)
        .filter(summary => state.shop === "all" || summary.shop === state.shop)
        .filter(summary => !search || summary.shop.toLowerCase().includes(search))
        .sort((a, b) => {
          if (state.sort === "shop") return a.shop.localeCompare(b.shop);
          return (b[state.sort] || 0) - (a[state.sort] || 0) || a.shop.localeCompare(b.shop);
        });
    }

    function renderControls() {
      els.monthSelect.innerHTML = [
        `<option value="latest">Latest (${monthLabel(latestMonth)})</option>`,
        ...months.slice().reverse().map(month => `<option value="${month}">${monthLabel(month)}</option>`)
      ].join("");

      els.shopSelect.innerHTML = [
        `<option value="all">All shops</option>`,
        ...shops.map(shop => `<option value="${escapeHtml(shop)}">${escapeHtml(shop)}</option>`)
      ].join("");

      els.monthSelect.value = state.month;
      els.shopSelect.value = state.shop;
      els.sortSelect.value = state.sort;
      els.metricSelect.value = state.metric;
    }

    function renderSummary() {
      const summary = summarize(activeRows());
      const conversion = summary.calls ? (summary.visits / summary.calls) * 100 : 0;
      const cards = [
        ["Total Calls", formatMetric("calls", summary.calls), `${number.format(summary.shops)} shops`],
        ["BDC Visits", formatMetric("visits", summary.visits), `${decimal.format(conversion)}% of calls`],
        ["BDC Effective RO", formatMetric("revenue", summary.revenue), `${formatMetric("avgRo", summary.avgRo)} avg RO`],
        ["Appointments", formatMetric("appointments", summary.appointments), "Monthly total"],
        ["Sentiment", formatMetric("sentiment", summary.sentiment), `${summary.sentimentRows} shops scored`],
        ["Next Day Calls", formatMetric("calls", summary.nextDay), "Satisfaction follow-up"]
      ];

      els.summaryGrid.innerHTML = cards.map(([label, value, note]) => `<article class="metric">
        <div class="label">${escapeHtml(label)}</div>
        <div class="value">${escapeHtml(value)}</div>
        <div class="note">${escapeHtml(note)}</div>
      </article>`).join("");
    }

    function renderTrend() {
      const key = state.metric;
      const data = trendRows();
      const values = data.map(row => row[key] || 0);
      const max = Math.max(1, ...values);
      const axisTop = formatMetric(key, max);
      const axisMid = formatMetric(key, max / 2);
      const color = key === "revenue" ? "gold" : key === "sentiment" ? "blue" : "";
      els.trendTitle.textContent = `${els.metricSelect.options[els.metricSelect.selectedIndex].text} Trend`;
      els.trendChart.innerHTML = `<div class="axis-y"><span>${escapeHtml(axisTop)}</span><span>${escapeHtml(axisMid)}</span><span>0</span></div>
        <div class="bars">${data.map(row => {
          const value = row[key] || 0;
          const height = value ? Math.max(2, (value / max) * 100) : 2;
          return `<div class="bar-col" title="${escapeHtml(monthLabel(row.month))}: ${escapeHtml(formatMetric(key, value))}">
            <div class="bar-stack"><div class="bar ${color}" style="height:${height}%"></div></div>
            <div class="bar-label">${escapeHtml(monthLabel(row.month).replace(" ", " '"))}</div>
          </div>`;
        }).join("")}</div>`;
    }

    function renderCategoryList(target, totalTarget, items) {
      const total = items.reduce((sum, item) => sum + item.value, 0);
      const max = Math.max(1, ...items.map(item => item.value));
      totalTarget.textContent = `${number.format(total)} total`;
      target.innerHTML = total ? items.map(item => `<div class="category-row">
        <div>${escapeHtml(item.label)}</div>
        <div class="track"><div class="fill ${item.color || ""}" style="width:${Math.max(2, (item.value / max) * 100)}%"></div></div>
        <div class="row-value">${number.format(item.value)}</div>
      </div>`).join("") : `<div class="empty">No rows for this selection.</div>`;
    }

    function renderCategories() {
      const summary = summarize(activeRows());
      renderCategoryList(els.programList, els.programTotal, [
        { label: "Starter Calls", value: summary.starter },
        { label: "Pro Calls", value: summary.pro, color: "blue" }
      ]);
      renderCategoryList(els.nextDayList, els.nextDayTotal, [
        { label: "Next Day Satisfaction", value: summary.nextDay },
        { label: "Welcome New Customer", value: summary.welcomeCustomer, color: "blue" },
        { label: "Welcome New Vehicle", value: summary.welcomeVehicle, color: "gold" },
        { label: "Returning Lost Vehicle", value: summary.returningLost, color: "red" }
      ]);
    }

    function renderRanking() {
      const summaries = shopSummaries();
      els.rankingStatus.textContent = `${number.format(summaries.length)} shops`;
      els.shopRanking.innerHTML = summaries.length ? summaries.map(summary => `<button class="shop-row ${state.shop === summary.shop ? "active" : ""}" type="button" data-shop="${escapeHtml(summary.shop)}">
        <span class="shop-name">${escapeHtml(summary.shop)}</span>
        <span class="pill">${escapeHtml(formatMetric(state.sort === "shop" ? "calls" : state.sort, summary[state.sort] || summary.calls))}</span>
        <span class="pill">${escapeHtml(formatMetric("sentiment", summary.sentiment))}</span>
      </button>`).join("") : `<div class="empty">No shops match the current filters.</div>`;
    }

    function renderTable() {
      const filtered = activeRows().slice().sort((a, b) => a.shop.localeCompare(b.shop));
      els.tableStatus.textContent = `${number.format(filtered.length)} monthly rows`;
      els.detailRows.innerHTML = filtered.length ? filtered.map(row => `<tr>
        <td>${escapeHtml(monthLabel(row.month))}</td>
        <td><strong>${escapeHtml(row.shop)}</strong></td>
        <td>${number.format(row.calls)}</td>
        <td>${number.format(row.visits)}</td>
        <td>${money.format(row.revenue)}</td>
        <td>${money.format(row.avgRo)}</td>
        <td>${number.format(row.starter)}</td>
        <td>${number.format(row.pro)}</td>
        <td>${number.format(row.appointments)}</td>
        <td>${escapeHtml(formatMetric("sentiment", row.sentiment))}</td>
      </tr>`).join("") : `<tr><td colspan="10" class="empty">No rows match the current filters.</td></tr>`;
    }

    function render() {
      renderSummary();
      renderTrend();
      renderCategories();
      renderRanking();
      renderTable();
      els.status.textContent = `${number.format(rows.length)} monthly rows loaded through ${monthLabel(latestMonth)}`;
    }

    renderControls();
    render();

    els.monthSelect.addEventListener("change", event => {
      state.month = event.target.value;
      render();
    });

    els.shopSelect.addEventListener("change", event => {
      state.shop = event.target.value;
      render();
    });

    els.searchInput.addEventListener("input", event => {
      state.search = event.target.value;
      render();
    });

    els.sortSelect.addEventListener("change", event => {
      state.sort = event.target.value;
      render();
    });

    els.metricSelect.addEventListener("change", event => {
      state.metric = event.target.value;
      render();
    });

    els.shopRanking.addEventListener("click", event => {
      const button = event.target.closest("[data-shop]");
      if (!button) return;
      state.shop = button.dataset.shop;
      els.shopSelect.value = state.shop;
      render();
    });
  </script>
